{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes</title>
    <link rel="stylesheet" href="{% static 'css/estilos_clientes.css' %}">
</head>
<body>
    <h1>Clientes</h1>
    <img src="{% static 'images/pessoas.svg' %}" alt="Ilustração de pessoas">

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Nascimento</th>
            </tr>
        </thead>
        <tbody>
            {% for cliente in clientes %}
            <tr>
                <td><a href="{% url 'clientes:cliente_id' cliente.id %}">{{ cliente.nome }}</a></td>
                <td>{{ cliente.email }}</td>
                <td>{{ cliente.nascimento|date:"d/m/Y" }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">Nenhum cliente cadastrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p>Total de clientes: {{ clientes|length }}</p>

    <p><a href="{% url 'inicio:index' %}">Voltar ao início</a></p>

    <button id="botao-teste" type="button">Clique-me</button>
    <script src="{% static 'js/script_clientes.js' %}"></script>
</body>
</html>
